<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NWG Coaches Hub | Log In</title>
<style>
  :root {
    --orange: #F5821F;
    --orange-dark: #DD6F14;
    --charcoal: #4B5560;
    --charcoal-dark: #3A424B;
    --bg: #F4F5F6;
    --text: #2E3339;
    --muted: #8A939C;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    position: relative;
    overflow: hidden;
  }

  /* Subtle background shapes echoing the dashboard cards */
  body::before,
  body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    opacity: 0.06;
  }

  body::before {
    width: 600px;
    height: 600px;
    background: var(--orange);
    top: -220px;
    left: -220px;
  }

  body::after {
    width: 500px;
    height: 500px;
    background: var(--charcoal);
    bottom: -200px;
    right: -180px;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: #FFFFFF;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(46, 51, 57, 0.12);
    padding: 44px 36px 36px;
  }

  .logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.2px;
    line-height: 1.25;
  }

  .logo .nwg {
    color: var(--orange);
  }

  .logo .rest {
    color: var(--charcoal);
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #DCE0E4;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text);
    background: #FAFBFC;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(245, 130, 31, 0.15);
    background: #FFFFFF;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--charcoal);
  }

  .remember input {
    accent-color: var(--orange);
  }

  .forgot {
    color: var(--orange);
    text-decoration: none;
    font-weight: 600;
  }

  .forgot:hover {
    text-decoration: underline;
  }

  button.submit {
    margin-top: 6px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--orange);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button.submit:hover {
    background: var(--orange-dark);
  }

  button.submit:active {
    transform: translateY(1px);
  }

  button.submit:focus-visible,
  .field input:focus-visible {
    outline: 2px solid var(--orange-dark);
    outline-offset: 2px;
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 24px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 420px) {
    .card {
      padding: 32px 24px 28px;
      border-radius: 10px;
    }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <span class="nwg">NWG</span> <span class="rest">Coaches Hub</span>
    </div>
    <div class="subtitle">Sign in to manage your locations</div>

    <form action="#" method="post">
      <div class="field">
        <label for="email">Email or username</label>
        <input type="text" id="email" name="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="submit">Log In</button>
    </form>

    <div class="footer-note">&copy; 2026 The Gymnastics Blueprint. All rights reserved.</div>
  </div>

</body>
</html>
